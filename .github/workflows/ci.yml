name: Python CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.3,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,rl,dqn]'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Smoke test Gymnasium environment
        run: python scripts/rl_smoke.py
      - name: Smoke test DQN training
        run: python scripts/train_dqn.py --timesteps 128 --learning-starts 16 --eval-freq 64 --output artifacts/dqn-smoke
      - name: Install Chromium for browser policy smoke test
        run: python -m playwright install --with-deps chromium
      - name: Smoke test DQN browser integration
        env:
          FLAPPY_BROWSER_SMOKE: '1'
        run: python -m pytest -q tests/test_dqn_browser_smoke.py
